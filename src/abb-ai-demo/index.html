<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABB AI Demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 16px;
        color: #94a3b8;
      }
      canvas {
        width: 100%;
        max-width: 640px;
        height: auto;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #020617;
      }
      .log {
        margin-top: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>WebSocket Video Demo</h1>
      <p>Connected to unified API-Examples-Web backend.</p>
      <canvas id="video-canvas" width="640" height="480"></canvas>
      <div id="log" class="log">Connecting...</div>
    </div>

    <script>
      const host = location.origin.replace(/^http/, "ws");
      const ws = new WebSocket(host);
      const logEl = document.getElementById("log");

      ws.onopen = function () {
        logEl.textContent = "Connected to WebSocket server";
      };

      ws.onmessage = function (event) {
        const size = event && event.data ? (event.data.size || event.data.length || 0) : 0;
        logEl.textContent = "Received data, size: " + size;
      };

      ws.onclose = function () {
        logEl.textContent = "WebSocket disconnected";
      };
    </script>
  </body>
</html>
