<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-label="On-site photo sample">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222c37"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4654"/>
      <stop offset="1" stop-color="#222a34"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" fill="url(#bg)"/>

  <!-- floor line -->
  <line x1="0" y1="186" x2="320" y2="186" stroke="#2a333f" stroke-width="2"/>

  <!-- brake resistor cabinet -->
  <rect x="96" y="52" width="128" height="134" rx="6" fill="url(#metal)" stroke="#445163" stroke-width="2"/>

  <!-- cooling fins -->
  <g stroke="#566576" stroke-width="3">
    <line x1="112" y1="72" x2="208" y2="72"/>
    <line x1="112" y1="86" x2="208" y2="86"/>
    <line x1="112" y1="100" x2="208" y2="100"/>
    <line x1="112" y1="114" x2="208" y2="114"/>
    <line x1="112" y1="128" x2="208" y2="128"/>
  </g>

  <!-- terminal box -->
  <rect x="132" y="146" width="56" height="30" rx="4" fill="#1c232c" stroke="#445163" stroke-width="2"/>
  <circle cx="148" cy="161" r="3.5" fill="#6f7c8c"/>
  <circle cx="172" cy="161" r="3.5" fill="#6f7c8c"/>

  <!-- ABB-red mounting tabs -->
  <rect x="78" y="92" width="18" height="22" rx="3" fill="#ff000f" opacity="0.85"/>
  <rect x="224" y="92" width="18" height="22" rx="3" fill="#ff000f" opacity="0.85"/>

  <!-- corner tag -->
  <rect x="0" y="0" width="64" height="26" fill="#ff000f"/>
  <text x="12" y="18" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">SITE</text>

  <!-- timestamp-ish caption -->
  <text x="308" y="228" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#6f7c8c">SAMPLE PHOTO</text>
</svg>
